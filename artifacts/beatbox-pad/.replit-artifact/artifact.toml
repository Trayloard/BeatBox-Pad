kind = "web"
previewPath = "/"
title = "BeatBox Pad"
version = "1.0.0"
id = "artifacts/beatbox-pad"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18644

[services.development]
run = "pnpm --filter @workspace/beatbox-pad run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beatbox-pad", "run", "build" ]
serve = "static"
publicDir = "artifacts/beatbox-pad/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18644"
BASE_PATH = "/"
